name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 nasm gcc-multilib make
      - name: Build test image
        run: make test_build 
      - name: Boot in QEMU
        run: ./scripts/run-qemu-test.sh
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: bin/*.log
