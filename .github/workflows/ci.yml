name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 nasm gcc-multilib make

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 nasm make bison flex libgmp3-dev libmpc-dev libmpfr-dev texinfo mtools
      - name: Cache cross compiler
        id: cross
        uses: actions/cache@v4
        with:
          path: ~/opt/cross
          key: i686-elf-gcc13.2.0-binutils2.42-${{ runner.os }}
      - name: Build cross compiler
        if: steps.cross.outputs.cache-hit != 'true'
        run: sh ./scripts/build-cross.sh
      - name: Add cross compiler to PATH
        run: echo "$HOME/opt/cross/bin" >> $GITHUB_PATH

      - name: Build test image
        run: make test_build 
      - name: Boot in QEMU
        run: sh ./scripts/run-qemu-test.sh
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: bin/*.log
